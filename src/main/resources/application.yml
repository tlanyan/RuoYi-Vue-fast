# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

  # 是否启用google authenticator
  enableGoogleAuth: false
  # 固定google authenticator code, 为空则表示使用生成器生成的code
  fixedGoogleAuthCode: ""

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    connection-timeout: 20000
    # 启用虚拟线程时无需此配置
    # threads:
    #   # tomcat最大线程数，默认为200
    #   max: 200
    #   # Tomcat启动初始化的线程数，默认值10
    #   min-spare: 10

# 日志配置
logging:
  level:
    com.ruoyi: info
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 虚拟线程配置 (Java 21+, Spring Boot 3.2+)
  # 启用后，Tomcat将使用虚拟线程处理HTTP请求，大幅提升并发性能
  threads:
    virtual:
      enabled: true
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

  # Flyway数据库迁移配置
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  # quartz
  quartz:
    auto-startup: false
    properties:
      org:
        quartz:
          threadPool:
            threadCount: 1

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: xxdadsfoeadswea098dsdudddeasfdasdfasddfasfdasfK8mN3pQ7rT2vX9zA5cF1hJ6
  # 令牌有效期（默认30分钟）
  expireTime: 1800

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.project.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mybatis/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc OpenAPI配置
springdoc:
  swagger-ui:
    # 是否启用Swagger UI
    enabled: false
    # Swagger UI访问路径
    path: /swagger-ui.html
    # 操作排序方式(method: 按HTTP方法排序)
    operations-sorter: method
    # 标签排序方式(alpha: 按字母顺序)
    tags-sorter: alpha
  api-docs:
    # OpenAPI文档访问路径
    path: /v3/api-docs
    # 是否启用API文档
    enabled: false
  # 排除的路径(不显示在文档中)
  paths-to-exclude: /error

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 代码生成
gen:
  # 作者
  author: ruoyi
  # 默认生成包路径 system 需改成自己的模块名称 如 system monitor tool
  packageName: com.ruoyi.project.system
  # 自动去除表前缀，默认是true
  autoRemovePre: false
  # 表前缀（生成类名不会包含表前缀，多个用逗号分隔）
  tablePrefix: sys_
  # 是否允许生成文件覆盖到本地（自定义路径），默认不允许
  allowOverwrite: false